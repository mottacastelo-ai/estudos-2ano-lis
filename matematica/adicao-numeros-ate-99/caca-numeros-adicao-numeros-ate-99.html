<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caça-Números — Adição de Números até 99 | Portal da Lis</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root { --primary: #0AACE8; --light: #5AC8FB; --bg: #EFF9FF; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Nunito', sans-serif; font-size: 1.1rem; background: var(--bg); min-height: 100vh; }

.header {
  background: linear-gradient(135deg, #044A7A, #0AACE8 60%, #5AC8FB);
  color: #fff; padding: 20px 24px; text-align: center;
}
.header .emoji { font-size: 2.5rem; }
.header h1 { font-family: 'Baloo 2', sans-serif; font-size: 1.6rem; font-weight: 900; margin-top: 4px; }
.header p { font-size: 1rem; opacity: 0.9; }

.container { max-width: 640px; margin: 0 auto; padding: 20px 16px 32px; }

.instrucao {
  background: #fff; border-radius: 14px; padding: 14px 18px;
  font-size: 1.15rem; color: #1a3a50; font-weight: 600;
  box-shadow: 0 2px 10px rgba(10,172,232,0.1); margin-bottom: 16px;
}

.clue-box {
  background: linear-gradient(135deg, #0AACE8, #5AC8FB);
  color: #fff; border-radius: 16px; padding: 16px 20px;
  text-align: center; margin-bottom: 18px;
  box-shadow: 0 4px 16px rgba(10,172,232,0.3);
}
.clue-box .clue-label { font-size: 0.95rem; opacity: 0.9; text-transform: uppercase; letter-spacing: 1px; }
.clue-box .clue-conta { font-family: 'Baloo 2', sans-serif; font-size: 1.8rem; font-weight: 900; margin-top: 4px; }

.placar { text-align: center; font-size: 1rem; font-weight: 700; color: var(--primary); margin-bottom: 14px; }

.grid-numeros {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}
.num-cell {
  background: #fff;
  border: 2.5px solid #bce4f8;
  border-radius: 12px;
  font-family: 'Baloo 2', sans-serif;
  font-size: 1.25rem;
  font-weight: 800;
  color: #1a3a50;
  padding: 14px 4px;
  text-align: center;
  cursor: pointer;
  min-height: 44px;
  min-width: 44px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.num-cell:hover:not(.achado) { background: #d0f0ff; border-color: var(--primary); }
.num-cell.achado { background: #d1fae5; border-color: #22c55e; color: #166534; pointer-events: none; }
.num-cell.errado { animation: shake 0.3s; background: #fee2e2; border-color: #ef4444; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

.encontrados-wrap {
  background: #fff; border-radius: 14px; padding: 14px 18px;
  margin-bottom: 20px; box-shadow: 0 2px 10px rgba(10,172,232,0.1);
}
.encontrados-wrap h3 { font-family: 'Baloo 2', sans-serif; color: var(--primary); font-size: 1.1rem; margin-bottom: 8px; }
.encontrados-lista { display: flex; flex-wrap: wrap; gap: 8px; }
.encontrados-lista span {
  background: #d1fae5; color: #166534; border-radius: 20px;
  padding: 6px 14px; font-size: 0.95rem; font-weight: 700;
}

.resultado {
  display: none;
  text-align: center;
  background: #fff;
  border-radius: 20px;
  padding: 36px 24px;
  box-shadow: 0 4px 20px rgba(10,172,232,0.14);
}
.resultado .emoji-final { font-size: 4rem; }
.resultado h2 { font-family: 'Baloo 2', sans-serif; font-size: 2rem; font-weight: 900; color: var(--primary); margin: 12px 0 6px; }
.resultado .msg { font-size: 1.2rem; color: #1a3a50; margin-bottom: 20px; }
.resultado .score-grande { font-size: 3rem; font-weight: 900; color: var(--primary); }

.btn-voltar {
  background: transparent;
  border: 2px solid var(--primary);
  color: var(--primary);
  border-radius: 50px;
  padding: 12px 28px;
  font-family: 'Baloo 2', sans-serif;
  font-size: 1.1rem;
  font-weight: 800;
  cursor: pointer;
  margin-top: 12px;
  min-height: 44px;
}

@media (max-width: 480px) {
  body { padding: 0; font-size: 1.15rem; }
  .header h1 { font-size: 1.3rem; }
  .grid-numeros { grid-template-columns: repeat(4, 1fr); }
  .clue-box .clue-conta { font-size: 1.5rem; }
}
</style>
</head>
<body>

<div class="header">
  <div class="emoji">🧮</div>
  <h1>Caça-Números</h1>
  <p>Encontre o resultado de cada conta na grade!</p>
</div>

<div class="container">

  <div class="instrucao">
    🎯 Resolva a conta mostrada e toque no número certo escondido na grade!
  </div>

  <div class="clue-box">
    <div class="clue-label">Resolva</div>
    <div class="clue-conta" id="clue-conta"></div>
  </div>

  <div class="placar">Encontrados: <span id="contador">0</span> / 6</div>

  <div class="grid-numeros" id="grid-numeros"></div>

  <div class="encontrados-wrap">
    <h3>Contas resolvidas</h3>
    <div class="encontrados-lista" id="encontrados-lista"></div>
  </div>

  <div class="resultado" id="resultado">
    <div class="emoji-final" id="emoji-final"></div>
    <h2>Resultado!</h2>
    <div class="score-grande"><span id="res-pct">0</span>%</div>
    <div class="msg" id="res-msg"></div>
    <button class="btn-voltar" onclick="voltarAoPortal()">⬅ Voltar ao Portal</button>
  </div>
</div>

<script>
(function () {

// Pistas — direto do conteúdo do livro (estratégias e três parcelas)
var pistas = [
  { texto: "37 + 11", resultado: 48 },
  { texto: "47 + 9", resultado: 56 },
  { texto: "20 + 16", resultado: 36 },
  { texto: "13 + 24 + 12", resultado: 49 },
  { texto: "41 + 36 (docinhos)", resultado: 77 },
  { texto: "52 + 35", resultado: 87 }
];

// Números de preenchimento (distratores — nunca coincidem com resultados)
var distratores = [46, 58, 66, 59, 67, 97, 29, 38, 65, 76, 44, 53, 92, 61, 34, 73, 55, 82, 19, 41, 63, 28, 71, 39];

function embaralhar(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

var pistasOrdenadas = embaralhar(pistas);
var pistaAtual = 0;
var encontrados = 0;
var acertosPrimeiraTentativa = 0;
var jaTentouAtual = false;

// Montar grid: 6 resultados corretos + 14 distratores = 20 células (5x4)
var resultadosSet = pistas.map(function(p) { return p.resultado; });
var numerosGrid = resultadosSet.concat(embaralhar(distratores).slice(0, 14));
numerosGrid = embaralhar(numerosGrid);

function playSound(tipo) {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    if (tipo === 'correct') {
      o.frequency.setValueAtTime(523, ctx.currentTime);
      o.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
      o.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
      g.gain.setValueAtTime(0.3, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      o.start(); o.stop(ctx.currentTime + 0.5);
    } else {
      o.frequency.setValueAtTime(300, ctx.currentTime);
      o.frequency.setValueAtTime(200, ctx.currentTime + 0.15);
      g.gain.setValueAtTime(0.3, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      o.start(); o.stop(ctx.currentTime + 0.4);
    }
  } catch(e) {}
}

function renderGrid() {
  var gridEl = document.getElementById('grid-numeros');
  gridEl.innerHTML = '';
  numerosGrid.forEach(function(num, i) {
    var cell = document.createElement('div');
    cell.className = 'num-cell';
    cell.textContent = num;
    cell.id = 'cell-' + i;
    cell.onclick = function() { tocarCelula(i, num); };
    gridEl.appendChild(cell);
  });
}

function renderPista() {
  if (pistaAtual >= pistasOrdenadas.length) {
    mostrarResultado();
    return;
  }
  jaTentouAtual = false;
  document.getElementById('clue-conta').textContent = pistasOrdenadas[pistaAtual].texto + ' = ?';
}

function tocarCelula(idx, num) {
  var cell = document.getElementById('cell-' + idx);
  if (cell.classList.contains('achado')) return;

  var alvo = pistasOrdenadas[pistaAtual].resultado;
  if (num === alvo) {
    cell.classList.add('achado');
    playSound('correct');
    encontrados++;
    if (!jaTentouAtual) acertosPrimeiraTentativa++;
    document.getElementById('contador').textContent = encontrados;

    var lista = document.getElementById('encontrados-lista');
    var span = document.createElement('span');
    span.textContent = pistasOrdenadas[pistaAtual].texto + ' = ' + alvo;
    lista.appendChild(span);

    pistaAtual++;
    setTimeout(renderPista, 500);
  } else {
    jaTentouAtual = true;
    cell.classList.add('errado');
    playSound('wrong');
    setTimeout(function() { cell.classList.remove('errado'); }, 350);
  }
}

function mostrarResultado() {
  document.querySelector('.clue-box').style.display = 'none';
  var res = document.getElementById('resultado');
  res.style.display = 'block';

  var pct = Math.round((acertosPrimeiraTentativa / pistas.length) * 100);
  window.sabendoScore = pct;

  document.getElementById('res-pct').textContent = pct;
  var emoji, msg;
  if (pct >= 80) { emoji = '🏆'; msg = 'Uau! Você caçou todos os números na primeira tentativa!'; }
  else if (pct >= 50) { emoji = '⭐'; msg = 'Muito bem! Você encontrou todas as contas!'; }
  else { emoji = '💪'; msg = 'Você conseguiu! Continue praticando as contas.'; }
  document.getElementById('emoji-final').textContent = emoji;
  document.getElementById('res-msg').textContent = msg;
}

renderGrid();
renderPista();

})();
</script>

</body>
