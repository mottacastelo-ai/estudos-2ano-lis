<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordene as Sílabas — Medindo Massas | Portal da Lis</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #0AACE8;
  --light: #5AC8FB;
  --bg: #EFF9FF;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  font-size: 1.1rem;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  background: linear-gradient(135deg, #044A7A, #0AACE8 60%, #5AC8FB);
  color: white;
  padding: 24px 20px 20px;
  text-align: center;
}

.header-emoji {
  font-size: 3rem;
  display: block;
  margin-bottom: 8px;
}

.header h1 {
  font-family: 'Baloo 2', sans-serif;
  font-size: 1.6rem;
  font-weight: 900;
  margin-bottom: 4px;
}

.header p { font-size: 1rem; opacity: 0.9; }

.badge {
  display: inline-block;
  background: rgba(255,255,255,0.2);
  border-radius: 20px;
  padding: 4px 14px;
  font-size: 0.9rem;
  margin-top: 8px;
}

main {
  flex: 1;
  padding: 24px 16px;
  max-width: 700px;
  margin: 0 auto;
  width: 100%;
}

.instrucoes {
  background: white;
  border-radius: 16px;
  padding: 16px 20px;
  margin-bottom: 20px;
  border: 2px solid #c7eaf9;
  font-size: 1.2rem;
  color: #044A7A;
  font-weight: 600;
}

.instrucoes strong { color: var(--primary); }

.progress-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.progress-bar-bg {
  flex: 1;
  height: 12px;
  background: #c7eaf9;
  border-radius: 20px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  background: var(--primary);
  border-radius: 20px;
  transition: width 0.4s ease;
}

.progress-label {
  font-size: 0.95rem;
  font-weight: 800;
  color: #044A7A;
  white-space: nowrap;
}

.word-card {
  background: white;
  border-radius: 20px;
  padding: 28px 24px;
  box-shadow: 0 4px 20px rgba(10,172,232,0.12);
  margin-bottom: 20px;
  text-align: center;
}

.word-hint {
  font-size: 1rem;
  font-weight: 700;
  color: #044A7A;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 8px;
}

.word-definition {
  font-size: 1.5rem;
  font-weight: 700;
  color: #1a2e3b;
  margin-bottom: 24px;
  line-height: 1.4;
}

.word-emoji {
  font-size: 3.5rem;
  margin-bottom: 16px;
  display: block;
}

.answer-zone {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  min-height: 60px;
  padding: 12px;
  background: #f0f9ff;
  border-radius: 14px;
  border: 2.5px dashed #bce4f8;
  margin-bottom: 20px;
  transition: background 0.2s;
}

.answer-zone.drag-over {
  background: #daf1fc;
  border-color: var(--primary);
}

.answer-zone.correct {
  background: #d1fae5;
  border-color: #22c55e;
  border-style: solid;
}

.answer-zone.wrong {
  background: #fee2e2;
  border-color: #ef4444;
  border-style: solid;
}

.answer-zone-label {
  font-size: 1rem;
  color: #93c5fd;
  font-weight: 600;
  font-style: italic;
  align-self: center;
}

.silaba-btn {
  background: linear-gradient(135deg, #0AACE8, #044A7A);
  color: white;
  border: none;
  border-radius: 12px;
  padding: 12px 18px;
  font-family: 'Baloo 2', sans-serif;
  font-size: 1.5rem;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.2s ease;
  min-height: 54px;
  min-width: 54px;
  touch-action: manipulation;
  box-shadow: 0 3px 10px rgba(10,172,232,0.3);
}

.silaba-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(10,172,232,0.4); }
.silaba-btn:active { transform: scale(0.95); }
.silaba-btn.used { opacity: 0.3; pointer-events: none; }

.silabas-pool {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin-bottom: 20px;
  padding: 16px;
  background: white;
  border-radius: 16px;
  border: 2px solid #c7eaf9;
}

.silaba-answer {
  background: linear-gradient(135deg, #044A7A, #033a63);
  color: white;
  border-radius: 10px;
  padding: 10px 16px;
  font-family: 'Baloo 2', sans-serif;
  font-size: 1.4rem;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.2s;
  min-height: 50px;
  min-width: 50px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  box-shadow: 0 2px 8px rgba(4,74,122,0.3);
}

.silaba-answer:hover { background: #ef4444; transform: scale(0.95); }

.answer-zone.correct .silaba-answer {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  cursor: default;
}

.answer-zone.correct .silaba-answer:hover {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  transform: none;
}

.feedback-box {
  padding: 14px 18px;
  border-radius: 12px;
  font-size: 1.2rem;
  font-weight: 700;
  text-align: center;
  margin-bottom: 16px;
  display: none;
}

.feedback-box.show { display: block; }
.feedback-box.correct { background: #d1fae5; color: #166534; border: 2px solid #22c55e; }
.feedback-box.wrong { background: #fee2e2; color: #991b1b; border: 2px solid #ef4444; }

.actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 8px;
}

.btn-check {
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 14px;
  padding: 16px 32px;
  font-family: 'Nunito', sans-serif;
  font-size: 1.2rem;
  font-weight: 800;
  cursor: pointer;
  transition: background 0.2s;
  min-height: 54px;
}

.btn-check:hover { background: #044A7A; }
.btn-check:disabled { background: #bce4f8; cursor: not-allowed; }

.btn-clear {
  background: white;
  color: var(--primary);
  border: 3px solid var(--primary);
  border-radius: 14px;
  padding: 14px 20px;
  font-family: 'Nunito', sans-serif;
  font-size: 1.1rem;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.2s;
  min-height: 54px;
}

.btn-clear:hover { background: var(--primary); color: white; }

.btn-next {
  width: 100%;
  background: #22c55e;
  color: white;
  border: none;
  border-radius: 14px;
  padding: 16px 24px;
  font-family: 'Nunito', sans-serif;
  font-size: 1.2rem;
  font-weight: 800;
  cursor: pointer;
  transition: background 0.2s;
  margin-bottom: 16px;
  min-height: 54px;
  display: none;
}

.btn-next:hover { background: #16a34a; }
.btn-next.show { display: block; }

.final-screen {
  display: none;
  text-align: center;
  background: white;
  border-radius: 20px;
  padding: 32px 24px;
  border: 3px solid var(--primary);
  margin-bottom: 20px;
}

.final-screen.show { display: block; }
.final-emoji { font-size: 4.5rem; margin-bottom: 12px; display: block; }

.final-title {
  font-family: 'Baloo 2', sans-serif;
  font-size: 2rem;
  font-weight: 900;
  color: var(--primary);
  margin-bottom: 8px;
}

.final-msg {
  font-size: 1.3rem;
  font-weight: 700;
  color: #1a2e3b;
  margin-bottom: 20px;
  line-height: 1.4;
}

.btn-restart {
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 14px;
  padding: 16px 32px;
  font-family: 'Nunito', sans-serif;
  font-size: 1.2rem;
  font-weight: 800;
  cursor: pointer;
  transition: background 0.2s;
  min-height: 54px;
}

.btn-restart:hover { background: #044A7A; }

footer {
  text-align: center;
  padding: 20px;
  border-top: 2px solid #c7eaf9;
}

.btn-back {
  background: white;
  color: var(--primary);
  border: 3px solid var(--primary);
  border-radius: 14px;
  padding: 14px 28px;
  font-family: 'Nunito', sans-serif;
  font-size: 1.1rem;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.2s;
  min-height: 48px;
}

.btn-back:hover { background: var(--primary); color: white; }

@media (max-width: 480px) {
  .word-definition { font-size: 1.3rem; }
  .silaba-btn { font-size: 1.3rem; padding: 10px 14px; }
  .silaba-answer { font-size: 1.2rem; padding: 8px 12px; }
  .header h1 { font-size: 1.3rem; }
  .btn-check, .btn-next { font-size: 1.1rem; }
  .actions { flex-direction: column; }
  .btn-check, .btn-clear { width: 100%; justify-content: center; }
}
</style>
</head>
<body>

<header class="header">
  <span class="header-emoji">⚖️</span>
  <h1>Ordene as Sílabas</h1>
  <p>Monte as palavras sobre massas com o Fiel!</p>
  <span class="badge">⚡ Praticar (80%)</span>
</header>

<main>
  <div class="instrucoes">
    <strong>Como jogar:</strong> toque nas sílabas na <strong>ordem certa</strong> para montar a palavra. Se errar, clique na sílaba na zona de resposta para removê-la!
  </div>

  <div class="progress-wrap">
    <div class="progress-bar-bg">
      <div class="progress-bar" id="progress-bar" style="width:0%"></div>
    </div>
    <div class="progress-label" id="progress-label">1 / 4</div>
  </div>

  <div id="game-area">
    <div class="word-card">
      <span class="word-emoji" id="word-emoji"></span>
      <div class="word-hint" id="word-hint"></div>
      <div class="word-definition" id="word-definition"></div>
    </div>

    <div class="answer-zone" id="answer-zone">
      <span class="answer-zone-label" id="answer-placeholder">Toque nas sílabas abaixo...</span>
    </div>

    <div class="feedback-box" id="feedback-box"></div>

    <div class="silabas-pool" id="silabas-pool"></div>

    <div class="actions">
      <button class="btn-clear" onclick="clearAnswer()">↩ Limpar</button>
      <button class="btn-check" id="btn-check" onclick="checkAnswer()">Verificar</button>
    </div>

    <button class="btn-next show" id="btn-next" onclick="nextWord()" style="display:none">Próxima Palavra →</button>
  </div>

  <div class="final-screen" id="final-screen">
    <span class="final-emoji" id="final-emoji"></span>
    <div class="final-title">Parabéns!</div>
    <div class="final-msg" id="final-msg"></div>
    <button class="btn-restart" onclick="initGame()">Jogar de novo!</button>
  </div>
</main>

<footer>
  <button class="btn-back" onclick="voltarAoPortal()">← Voltar ao Portal</button>
</footer>

<script>
// Palavras — todas rastreáveis em termos_tecnicos (Balança, Quilograma, Grama, leve/pesado)
const words = [
  {
    word: 'BALANÇA',
    silabas: ['BA', 'LAN', 'ÇA'],
    emoji: '⚖️',
    hint: 'Palavra do tema',
    definition: 'Instrumento usado para comparar a massa de dois objetos.'
  },
  {
    word: 'QUILOGRAMA',
    silabas: ['QUI', 'LO', 'GRA', 'MA'],
    emoji: '📦',
    hint: 'Palavra do tema',
    definition: 'Unidade de massa que equivale a 1000 gramas — abreviada como kg.'
  },
  {
    word: 'GRAMA',
    silabas: ['GRA', 'MA'],
    emoji: '🌾',
    hint: 'Palavra do tema',
    definition: 'Unidade de massa usada para objetos com pouca massa — abreviada como g.'
  },
  {
    word: 'PESADO',
    silabas: ['PE', 'SA', 'DO'],
    emoji: '🏋️',
    hint: 'Palavra do tema',
    definition: 'Quando um objeto tem mais massa do que o outro na balança.'
  }
];

let current = 0;
let score = 0;
let answered = false;
let selectedSilabas = [];
let shuffledSilabas = [];

function playSound(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    if (type === 'correct') {
      o.frequency.setValueAtTime(523, ctx.currentTime);
      o.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
      o.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
      g.gain.setValueAtTime(0.3, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      o.start(); o.stop(ctx.currentTime + 0.5);
    } else {
      o.frequency.setValueAtTime(300, ctx.currentTime);
      o.frequency.setValueAtTime(200, ctx.currentTime + 0.15);
      g.gain.setValueAtTime(0.3, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      o.start(); o.stop(ctx.currentTime + 0.4);
    }
  } catch(e) {}
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function initGame() {
  current = 0;
  score = 0;
  document.getElementById('final-screen').classList.remove('show');
  document.getElementById('game-area').style.display = 'block';
  loadWord();
}

function loadWord() {
  answered = false;
  selectedSilabas = [];

  const w = words[current];
  shuffledSilabas = shuffle(w.silabas);

  document.getElementById('word-emoji').textContent = w.emoji;
  document.getElementById('word-hint').textContent = w.hint;
  document.getElementById('word-definition').textContent = w.definition;
  document.getElementById('progress-label').textContent = `${current + 1} / ${words.length}`;
  document.getElementById('progress-bar').style.width = `${(current / words.length) * 100}%`;

  const feedback = document.getElementById('feedback-box');
  feedback.className = 'feedback-box';
  feedback.textContent = '';

  const btnNext = document.getElementById('btn-next');
  btnNext.style.display = 'none';

  document.getElementById('btn-check').disabled = false;

  renderAnswerZone();
  renderPool();
}

function renderPool() {
  const pool = document.getElementById('silabas-pool');
  pool.innerHTML = '';
  shuffledSilabas.forEach((sil, idx) => {
    const btn = document.createElement('button');
    btn.className = 'silaba-btn';
    btn.textContent = sil;
    btn.dataset.idx = idx;
    if (selectedSilabas.includes(idx)) btn.classList.add('used');
    btn.onclick = () => selectSilaba(idx, sil);
    pool.appendChild(btn);
  });
}

function renderAnswerZone() {
  const zone = document.getElementById('answer-zone');
  zone.className = 'answer-zone';

  if (selectedSilabas.length === 0) {
    zone.innerHTML = '<span class="answer-zone-label" id="answer-placeholder">Toque nas sílabas abaixo...</span>';
    return;
  }

  zone.innerHTML = '';
  selectedSilabas.forEach(idx => {
    const sil = shuffledSilabas[idx];
    const btn = document.createElement('button');
    btn.className = 'silaba-answer';
    btn.textContent = sil;
    btn.title = 'Clique para remover';
    btn.onclick = () => removeSilaba(idx);
    zone.appendChild(btn);
  });
}

function selectSilaba(idx, sil) {
  if (answered) return;
  if (selectedSilabas.includes(idx)) return;

  selectedSilabas.push(idx);
  renderAnswerZone();
  renderPool();
}

function removeSilaba(idx) {
  if (answered) return;
  selectedSilabas = selectedSilabas.filter(i => i !== idx);
  renderAnswerZone();
  renderPool();
}

function clearAnswer() {
  if (answered) return;
  selectedSilabas = [];
  renderAnswerZone();
  renderPool();
}

function checkAnswer() {
  if (answered) return;
  if (selectedSilabas.length === 0) {
    alert('Selecione as sílabas antes de verificar!');
    return;
  }

  const w = words[current];
  const built = selectedSilabas.map(i => shuffledSilabas[i]).join('');
  const isCorrect = built === w.word;

  answered = true;
  document.getElementById('btn-check').disabled = true;

  const zone = document.getElementById('answer-zone');
  const feedback = document.getElementById('feedback-box');
  const btnNext = document.getElementById('btn-next');

  document.querySelectorAll('.silaba-answer').forEach(b => {
    b.onclick = null;
    b.style.cursor = 'default';
  });

  if (isCorrect) {
    score++;
    zone.classList.add('correct');
    feedback.textContent = `✅ Perfeito! A palavra é ${w.word}!`;
    feedback.className = 'feedback-box show correct';
    playSound('correct');
  } else {
    zone.classList.add('wrong');
    feedback.textContent = `❌ Quase! A ordem certa é: ${w.silabas.join(' - ')} = ${w.word}`;
    feedback.className = 'feedback-box show wrong';
    playSound('wrong');

    const pool = document.getElementById('silabas-pool');
    pool.innerHTML = '';
    w.silabas.forEach(sil => {
      const span = document.createElement('span');
      span.className = 'silaba-btn';
      span.textContent = sil;
      span.style.cursor = 'default';
      span.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';
      pool.appendChild(span);
    });
  }

  btnNext.style.display = 'block';
  btnNext.textContent = current < words.length - 1 ? 'Próxima Palavra →' : 'Ver Resultado!';
}

function nextWord() {
  current++;
  if (current >= words.length) {
    showFinal();
  } else {
    loadWord();
  }
}

function showFinal() {
  document.getElementById('game-area').style.display = 'none';
  const fs = document.getElementById('final-screen');
  fs.classList.add('show');

  document.getElementById('progress-bar').style.width = '100%';
  document.getElementById('progress-label').textContent = `${words.length} / ${words.length}`;

  const pct = score / words.length;
  let emoji, msg;

  if (pct === 1) {
    emoji = '🏆';
    msg = 'Incrível! Você montou todas as palavras sem errar nenhuma! O Fiel está orgulhoso de você!';
  } else if (pct >= 0.75) {
    emoji = '🎉';
    msg = `${score} de ${words.length} palavras certas! Muito bem! Você está dominando o vocabulário das massas!`;
  } else if (pct >= 0.5) {
    emoji = '😊';
    msg = `${score} de ${words.length} palavras certas! Bom trabalho! Que tal tentar de novo?`;
  } else {
    emoji = '💪';
    msg = `Continue praticando! Você vai arrasar na próxima tentativa!`;
  }

  window.sabendoScore = Math.round(pct * 100);

  document.getElementById('final-emoji').textContent = emoji;
  document.getElementById('final-msg').textContent = msg;
  playSound('correct');
  fs.scrollIntoView({ behavior: 'smooth' });
}

window.initGame = initGame;
window.clearAnswer = clearAnswer;
window.checkAnswer = checkAnswer;
window.nextWord = nextWord;

initGame();
</script>
