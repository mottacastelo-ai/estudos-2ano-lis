<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arrastar e Soltar — Convivência nos Transportes Coletivos | Portal da Lis</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #A855F7;
  --light: #D08EF8;
  --bg: #FAF5FF;
  --dark: #4A1272;
  --correct: #22C55E;
  --wrong: #EF4444;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  font-size: 1.1rem;
  background: var(--bg);
  min-height: 100vh;
}

header {
  background: linear-gradient(135deg, #4A1272, #A855F7 60%, #D08EF8);
  padding: 22px 24px 18px;
  color: #fff;
  text-align: center;
}

header .emoji { font-size: 2.8rem; display: block; margin-bottom: 6px; }
header h1 { font-family: 'Baloo 2', cursive; font-size: 1.7rem; font-weight: 900; }
header p { font-size: 1rem; opacity: 0.9; font-weight: 600; margin-top: 4px; }

.container { max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; }

.instructions {
  background: #fff;
  border-radius: 16px;
  padding: 18px 22px;
  border: 2px solid #E9D5FF;
  margin-bottom: 24px;
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--dark);
  text-align: center;
  line-height: 1.5;
}

.cards-pool {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  margin-bottom: 32px;
  background: #fff;
  border-radius: 20px;
  padding: 22px;
  border: 2px dashed #D08EF8;
  min-height: 90px;
}

.drag-card {
  background: linear-gradient(135deg, #EDE9FE, #F5F3FF);
  border: 2px solid #A855F7;
  border-radius: 14px;
  padding: 14px 18px;
  cursor: grab;
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--dark);
  transition: all 0.18s;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  min-width: 44px;
}

.drag-card:hover { transform: scale(1.04); box-shadow: 0 4px 16px rgba(168,85,247,0.25); }
.drag-card.dragging { opacity: 0.4; }

.categories {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
  margin-bottom: 28px;
}

.cat-box {
  background: #fff;
  border-radius: 20px;
  padding: 18px;
  border: 3px solid #E9D5FF;
  min-height: 200px;
  transition: all 0.2s;
}

.cat-box.drag-over { border-color: var(--primary); background: #F5F3FF; }

.cat-title {
  font-family: 'Baloo 2', cursive;
  font-size: 1.15rem;
  font-weight: 900;
  text-align: center;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 2px solid #E9D5FF;
  color: var(--dark);
}

.cat-items { display: flex; flex-direction: column; gap: 8px; min-height: 100px; }

.placed-card {
  background: #F3E8FF;
  color: #6D28D9;
  border: 2px solid #C4B5FD;
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 0.95rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: grab;
  min-height: 44px;
}

.placed-card.correct { background: #DCFCE7 !important; color: #15803D !important; border-color: #86EFAC !important; }
.placed-card.wrong { background: #FEE2E2 !important; color: #B91C1C !important; border-color: #FCA5A5 !important; }

.check-btn {
  display: block;
  width: 100%;
  max-width: 380px;
  margin: 0 auto 16px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 14px;
  padding: 16px;
  font-family: 'Nunito', sans-serif;
  font-size: 1.2rem;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.18s;
  min-height: 52px;
}

.check-btn:hover { background: #9333EA; }
.check-btn:disabled { opacity: 0.5; cursor: default; }

.result-msg {
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  text-align: center;
  font-size: 1.2rem;
  font-weight: 800;
  border: 2px solid #E9D5FF;
  margin-bottom: 16px;
  display: none;
}

.action-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

.retry-btn {
  background: var(--primary);
  border: none;
  color: #fff;
  border-radius: 14px;
  padding: 14px 28px;
  font-family: 'Nunito', sans-serif;
  font-size: 1.1rem;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.18s;
  min-height: 48px;
}

.retry-btn:hover { background: #9333EA; }

.back-btn {
  background: #fff;
  border: 2px solid var(--primary);
  color: var(--primary);
  border-radius: 14px;
  padding: 14px 28px;
  font-family: 'Nunito', sans-serif;
  font-size: 1.1rem;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.18s;
  min-height: 48px;
}

.back-btn:hover { background: var(--bg); }

@media (max-width: 480px) {
  body { padding: 12px; font-size: 1.15rem; }
  header h1 { font-size: 1.3rem; }
  .container { padding: 16px 12px 40px; }
  .categories { grid-template-columns: 1fr; }
  .check-btn, .retry-btn, .back-btn { width: 100%; justify-content: center; }
}
</style>
</head>
<body>
<header>
  <span class="emoji">🔔</span>
  <h1>Arraste para o Transporte Certo</h1>
  <p>Trilim quer saber: qual característica é de qual transporte?</p>
</header>
<div class="container">
  <div class="instructions">
    👇 Arraste cada cartão para o transporte correto: <strong>Maria-Fumaça 🚂</strong>, <strong>Bonde 🚋</strong> ou <strong>Ônibus 🚌</strong>
  </div>

  <div class="cards-pool" id="pool"></div>

  <div class="categories">
    <div class="cat-box" id="cat-trem" data-cat="trem">
      <div class="cat-title">🚂 Maria-Fumaça</div>
      <div class="cat-items" id="items-trem"></div>
    </div>
    <div class="cat-box" id="cat-bonde" data-cat="bonde">
      <div class="cat-title">🚋 Bonde</div>
      <div class="cat-items" id="items-bonde"></div>
    </div>
    <div class="cat-box" id="cat-onibus" data-cat="onibus">
      <div class="cat-title">🚌 Ônibus</div>
      <div class="cat-items" id="items-onibus"></div>
    </div>
  </div>

  <button class="check-btn" id="check-btn" onclick="checkAnswers()">✅ Verificar Respostas</button>
  <div class="result-msg" id="result-msg"></div>
  <div class="action-btns">
    <button class="back-btn" onclick="voltarAoPortal()">⬅️ Voltar ao Portal</button>
    <button class="retry-btn" onclick="resetGame()">🔄 Tentar de Novo</button>
  </div>
</div>
<script>
const items = [
  { id: 'i1', emoji: '💨', text: 'Soltava fumaça da queima de carvão', cat: 'trem' },
  { id: 'i2', emoji: '🎫', text: 'Tinha vagão de primeira e de segunda classe', cat: 'trem' },
  { id: 'i3', emoji: '👃', text: 'Machado de Assis dizia: não roçar as ventas do vizinho', cat: 'bonde' },
  { id: 'i4', emoji: '🏖️', text: 'Hoje ainda existe passeio turístico no Rio e em Santos', cat: 'bonde' },
  { id: 'i5', emoji: '📅', text: 'Começou a circular no Brasil em 1908', cat: 'onibus' },
  { id: 'i6', emoji: '📰', text: 'Ficou superlotado numa notícia de 1954 e numa charge de 2016', cat: 'onibus' }
];

let placed = {};
let draggedId = null;

function playSound(type) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  if (type === 'correct') {
    o.frequency.setValueAtTime(523, ctx.currentTime);
    o.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
    o.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
    g.gain.setValueAtTime(0.3, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    o.start(); o.stop(ctx.currentTime + 0.5);
  } else {
    o.frequency.setValueAtTime(300, ctx.currentTime);
    o.frequency.setValueAtTime(200, ctx.currentTime + 0.15);
    g.gain.setValueAtTime(0.3, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    o.start(); o.stop(ctx.currentTime + 0.4);
  }
}

function buildPool() {
  const pool = document.getElementById('pool');
  pool.innerHTML = '';
  const shuffled = [...items].sort(() => Math.random() - 0.5);
  shuffled.forEach(item => {
    if (!placed[item.id]) {
      pool.appendChild(createCard(item, 'pool'));
    }
  });
  ['trem', 'bonde', 'onibus'].forEach(cat => {
    document.getElementById('items-' + cat).innerHTML = '';
  });
  Object.entries(placed).forEach(([id, cat]) => {
    const item = items.find(i => i.id === id);
    document.getElementById('items-' + cat).appendChild(createCard(item, cat));
  });
}

function createCard(item, loc) {
  const card = document.createElement('div');
  card.className = loc === 'pool' ? 'drag-card' : 'placed-card';
  card.id = 'card-' + item.id;
  card.draggable = true;
  card.innerHTML = `${item.emoji} ${item.text}`;
  card.dataset.id = item.id;

  card.addEventListener('dragstart', () => {
    draggedId = item.id;
    card.classList.add('dragging');
  });
  card.addEventListener('dragend', () => card.classList.remove('dragging'));

  card.addEventListener('touchstart', onTouchStart, { passive: false });

  return card;
}

document.querySelectorAll('.cat-box').forEach(box => {
  box.addEventListener('dragover', e => {
    e.preventDefault();
    box.classList.add('drag-over');
  });
  box.addEventListener('dragleave', () => box.classList.remove('drag-over'));
  box.addEventListener('drop', e => {
    e.preventDefault();
    box.classList.remove('drag-over');
    if (!draggedId) return;
    placed[draggedId] = box.dataset.cat;
    draggedId = null;
    buildPool();
  });
});

document.getElementById('pool').addEventListener('dragover', e => e.preventDefault());
document.getElementById('pool').addEventListener('drop', e => {
  e.preventDefault();
  if (!draggedId) return;
  delete placed[draggedId];
  draggedId = null;
  buildPool();
});

// Suporte touch — seguindo ERR-004 (preventDefault) e ERR-007 (touchend no document)
function onTouchStart(e) {
  e.preventDefault();
  const card = e.currentTarget;
  draggedId = card.dataset.id;
  card.style.opacity = '0.5';
}

document.addEventListener('touchmove', function (e) {
  if (!draggedId) return;
  e.preventDefault();
  const touch = e.touches[0];
  document.querySelectorAll('.cat-box').forEach(b => b.classList.remove('drag-over'));
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  const catBox = el ? el.closest('.cat-box') : null;
  if (catBox) catBox.classList.add('drag-over');
}, { passive: false });

document.addEventListener('touchend', function (e) {
  if (!draggedId) return;
  const touch = e.changedTouches[0];
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  const catBox = el ? el.closest('.cat-box') : null;
  const pool = el ? el.closest('#pool') : null;

  if (catBox) {
    placed[draggedId] = catBox.dataset.cat;
  } else if (pool) {
    delete placed[draggedId];
  }

  document.querySelectorAll('.cat-box').forEach(b => b.classList.remove('drag-over'));
  document.querySelectorAll('.drag-card, .placed-card').forEach(c => c.style.opacity = '');
  draggedId = null;
  buildPool();
}, { passive: true });

function checkAnswers() {
  if (Object.keys(placed).length < items.length) {
    const msg = document.getElementById('result-msg');
    msg.textContent = '⚠️ Arraste todos os cartões antes de verificar!';
    msg.style.display = 'block';
    msg.style.color = '#92400E';
    return;
  }
  let correct = 0;
  items.forEach(item => {
    const card = document.getElementById('card-' + item.id);
    if (!card) return;
    card.classList.remove('correct', 'wrong');
    if (placed[item.id] === item.cat) { card.classList.add('correct'); correct++; }
    else card.classList.add('wrong');
  });

  window.sabendoScore = Math.round((correct / items.length) * 100);

  const msg = document.getElementById('result-msg');
  msg.style.display = 'block';
  if (correct === items.length) {
    msg.textContent = `🏆 Perfeito! Você classificou todos os ${items.length} cartões corretamente!`;
    msg.style.color = '#15803D';
    playSound('correct');
  } else {
    msg.textContent = `✨ Você acertou ${correct} de ${items.length}! Os cartões vermelhos estão errados. Tente de novo!`;
    msg.style.color = '#92400E';
    playSound('wrong');
  }
  document.getElementById('check-btn').disabled = true;
}

function resetGame() {
  placed = {};
  document.getElementById('result-msg').style.display = 'none';
  document.getElementById('check-btn').disabled = false;
  buildPool();
}

buildPool();
</script>
