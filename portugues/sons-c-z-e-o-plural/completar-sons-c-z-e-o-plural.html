<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete com C, Ç ou Z — Sons e Plural | Portal da Lis</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #E8430A;
  --light: #FB8C5A;
  --bg: #FFF4EF;
  --dark: #7A1F04;
  --correct: #22C55E;
  --wrong: #EF4444;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  font-size: 1.1rem;
}

header {
  background: linear-gradient(135deg, #7A1F04, #E8430A 60%, #FB8C5A);
  color: white;
  padding: 24px 20px;
  text-align: center;
}

header .emoji { font-size: 2.8rem; display: block; margin-bottom: 8px; }

header h1 {
  font-family: 'Baloo 2', cursive;
  font-size: 1.8rem;
  font-weight: 900;
  line-height: 1.2;
}

header p { font-size: 1rem; opacity: 0.92; margin-top: 6px; }

main {
  flex: 1;
  padding: 20px 16px;
  max-width: 720px;
  margin: 0 auto;
  width: 100%;
}

.progress-wrap {
  background: white;
  border-radius: 16px;
  padding: 14px 18px;
  box-shadow: 0 3px 12px rgba(232,67,10,0.15);
  margin-bottom: 18px;
}

.progress-top {
  display: flex;
  justify-content: space-between;
  font-weight: 800;
  color: var(--dark);
  font-size: 1.05rem;
  margin-bottom: 8px;
}

.progress-bar {
  height: 14px;
  background: #FEDCCB;
  border-radius: 10px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--primary), var(--light));
  border-radius: 10px;
  transition: width 0.35s ease;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 26px 20px;
  box-shadow: 0 4px 20px rgba(232,67,10,0.15);
  text-align: center;
}

.word-emoji { font-size: 3.6rem; display: block; margin-bottom: 10px; }

.word-hint {
  font-size: 1.05rem;
  font-weight: 700;
  color: #7A5548;
  margin-bottom: 14px;
}

.word-display {
  font-family: 'Baloo 2', cursive;
  font-size: 2.3rem;
  font-weight: 900;
  color: var(--dark);
  letter-spacing: 2px;
  margin-bottom: 24px;
  word-break: break-word;
}

.gap {
  display: inline-block;
  min-width: 34px;
  border-bottom: 4px solid var(--primary);
  color: var(--primary);
}

.gap.filled { border-bottom-color: var(--correct); color: var(--correct); }

.letters-grid {
  display: flex;
  gap: 14px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 6px;
}

.letter-btn {
  background: var(--bg);
  border: 3px solid #FEDCCB;
  border-radius: 16px;
  padding: 16px 26px;
  font-family: 'Baloo 2', cursive;
  font-size: 1.6rem;
  font-weight: 900;
  color: var(--dark);
  cursor: pointer;
  min-height: 60px;
  min-width: 70px;
  transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
}

.letter-btn:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--light); background: #FFE7DB; }
.letter-btn:disabled { cursor: default; }
.letter-btn.picked-correct { background: #DCFCE7; border-color: var(--correct); color: #166534; }
.letter-btn.picked-wrong { background: #FEE2E2; border-color: var(--wrong); color: #991B1B; }
.letter-btn.reveal-correct { background: #DCFCE7; border-color: var(--correct); color: #166534; }

.feedback {
  display: none;
  margin-top: 20px;
  border-radius: 14px;
  padding: 16px 18px;
  font-size: 1.1rem;
  font-weight: 700;
  line-height: 1.45;
  text-align: left;
}

.feedback.show { display: block; }
.feedback.ok { background: #DCFCE7; color: #166534; border: 3px solid var(--correct); }
.feedback.no { background: #FEF3C7; color: #92400E; border: 3px solid #F59E0B; }
.feedback .fb-title { font-family: 'Baloo 2', cursive; font-size: 1.25rem; display: block; margin-bottom: 4px; }

.next-wrap { text-align: center; margin-top: 18px; display: none; }
.next-wrap.show { display: block; }

.btn-main {
  background: linear-gradient(135deg, var(--primary), var(--light));
  color: white;
  border: none;
  border-radius: 14px;
  padding: 16px 32px;
  font-family: 'Nunito', sans-serif;
  font-size: 1.15rem;
  font-weight: 800;
  cursor: pointer;
  transition: transform 0.15s ease;
  min-height: 52px;
  min-width: 44px;
}

.btn-main:hover { transform: scale(1.04); }

.result {
  display: none;
  background: white;
  border-radius: 20px;
  padding: 28px 22px;
  box-shadow: 0 4px 20px rgba(232,67,10,0.18);
  text-align: center;
}

.result.show { display: block; }
.result .res-emoji { font-size: 4rem; display: block; margin-bottom: 10px; }

.result h2 {
  font-family: 'Baloo 2', cursive;
  font-size: 1.9rem;
  color: var(--dark);
  margin-bottom: 10px;
}

.result .res-score {
  font-size: 1.4rem;
  font-weight: 900;
  color: var(--primary);
  margin-bottom: 10px;
}

.result p { font-size: 1.15rem; color: #555; font-weight: 700; line-height: 1.5; margin-bottom: 18px; }

.btn-reset {
  background: white;
  border: 3px solid var(--primary);
  color: var(--primary);
  border-radius: 14px;
  padding: 14px 26px;
  font-family: 'Nunito', sans-serif;
  font-size: 1.1rem;
  font-weight: 800;
  cursor: pointer;
  min-height: 52px;
  transition: all 0.2s ease;
}

.btn-reset:hover { background: var(--primary); color: white; }

footer { text-align: center; padding: 20px 16px; }

.btn-back {
  background: white;
  border: 3px solid var(--primary);
  color: var(--primary);
  border-radius: 14px;
  padding: 14px 28px;
  font-family: 'Nunito', sans-serif;
  font-size: 1.1rem;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.2s ease;
  min-height: 48px;
}

.btn-back:hover { background: var(--primary); color: white; }

@media (max-width: 480px) {
  body { font-size: 1.15rem; }
  header h1 { font-size: 1.3rem; }
  main { padding: 14px 10px; }
  .letters-grid { flex-direction: column; }
  .letter-btn, .btn-main, .btn-reset { width: 100%; justify-content: center; text-align: center; }
  .word-display { font-size: 1.8rem; }
}
</style>
</head>
<body>

<header>
  <span class="emoji">🐍</span>
  <h1>Complete com C, Ç ou Z</h1>
  <p>Zizo escondeu uma letra em cada palavra. Você adivinha qual é?</p>
</header>

<main>
  <div class="progress-wrap" id="progress-wrap">
    <div class="progress-top">
      <span id="prog-label">Palavra 1 de 8</span>
      <span id="prog-score">Acertos: 0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
  </div>

  <div class="card" id="game-card">
    <span class="word-emoji" id="word-emoji"></span>
    <div class="word-hint" id="word-hint"></div>
    <div class="word-display" id="word-display"></div>

    <div class="letters-grid">
      <button class="letter-btn" id="btn-c" onclick="escolherLetra('C')">C</button>
      <button class="letter-btn" id="btn-ce" onclick="escolherLetra('Ç')">Ç</button>
      <button class="letter-btn" id="btn-z" onclick="escolherLetra('Z')">Z</button>
    </div>

    <div class="feedback" id="feedback"></div>
    <div class="next-wrap" id="next-wrap">
      <button class="btn-main" onclick="proximaPalavra()">Próxima →</button>
    </div>
  </div>

  <div class="result" id="result">
    <span class="res-emoji" id="res-emoji">🎉</span>
    <h2 id="res-title"></h2>
    <div class="res-score" id="res-score"></div>
    <p id="res-text"></p>
    <button class="btn-reset" onclick="reiniciarJogo()">Jogar de novo 🔁</button>
  </div>
</main>

<footer>
  <button class="btn-back" onclick="voltarAoPortal()">← Voltar ao Portal</button>
</footer>

<script>
(function () {

  /* A letra certa é sempre lida diretamente da própria palavra (item.palavra.charAt(item.gap)),
     nunca transcrita à parte — isso evita o erro de índice do ERR-002.
     Todas as palavras vêm do banco autorizado (termos_tecnicos do tema). */
  var palavras = [
    { palavra: 'doce', gap: 2, emoji: '🍬', dica: 'Guloseima que a gente adora comer',
      fb: 'Escrevemos <strong>doce</strong> com <strong>c</strong>. Antes de e ou i, o c já tem som de s!' },
    { palavra: 'cinto', gap: 0, emoji: '👖', dica: 'Usamos para segurar a calça',
      fb: 'Escrevemos <strong>cinto</strong> com <strong>c</strong>. Antes de i, o c tem som de s!' },
    { palavra: 'bicicleta', gap: 2, emoji: '🚲', dica: 'Tem duas rodas e pedais',
      fb: 'Escrevemos <strong>bicicleta</strong> com <strong>c</strong>. Antes de i, o c tem som de s!' },
    { palavra: 'açúcar', gap: 1, emoji: '🍚', dica: 'Deixa o café e o bolo doces',
      fb: 'Escrevemos <strong>açúcar</strong> com <strong>ç</strong>. Antes de u, precisa da cedilha para ter som de s!' },
    { palavra: 'nação', gap: 2, emoji: '🌎', dica: 'Um país e seu povo',
      fb: 'Escrevemos <strong>nação</strong> com <strong>ç</strong>. Antes de ã, precisa da cedilha para ter som de s!' },
    { palavra: 'espaço', gap: 4, emoji: '🌌', dica: 'Lugar vazio, ou onde ficam as estrelas',
      fb: 'Escrevemos <strong>espaço</strong> com <strong>ç</strong>. Antes de o, precisa da cedilha para ter som de s!' },
    { palavra: 'azulejo', gap: 1, emoji: '🧱', dica: 'Cerâmica que cobre paredes de banheiro',
      fb: 'Escrevemos <strong>azulejo</strong> com <strong>z</strong>. Esse som forte é sempre com z!' },
    { palavra: 'fazer', gap: 2, emoji: '🛠️', dica: 'Verbo de construir ou preparar algo',
      fb: 'Escrevemos <strong>fazer</strong> com <strong>z</strong>. Esse som forte é sempre com z!' }
  ];

  var ordem = [];
  var indiceAtual = 0;
  var acertos = 0;
  var respondeu = false;

  function playSound(type) {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    if (type === 'correct') {
      o.frequency.setValueAtTime(523, ctx.currentTime);
      o.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
      o.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
      g.gain.setValueAtTime(0.3, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      o.start(); o.stop(ctx.currentTime + 0.5);
    } else {
      o.frequency.setValueAtTime(300, ctx.currentTime);
      o.frequency.setValueAtTime(200, ctx.currentTime + 0.15);
      g.gain.setValueAtTime(0.3, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      o.start(); o.stop(ctx.currentTime + 0.4);
    }
  }

  function embaralhar(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function letraCerta(item) {
    return item.palavra.charAt(item.gap).toUpperCase();
  }

  function montarDisplay(item, letraPreenchida) {
    var antes = item.palavra.substring(0, item.gap);
    var depois = item.palavra.substring(item.gap + 1);
    var meio = letraPreenchida
      ? '<span class="gap filled">' + letraPreenchida.toLowerCase() + '</span>'
      : '<span class="gap">&nbsp;</span>';
    return antes + meio + depois;
  }

  function botaoIdParaLetra(letra) {
    if (letra === 'C') return 'btn-c';
    if (letra === 'Ç') return 'btn-ce';
    return 'btn-z';
  }

  function mostrarPalavra() {
    respondeu = false;
    var item = ordem[indiceAtual];

    document.getElementById('prog-label').textContent =
      'Palavra ' + (indiceAtual + 1) + ' de ' + ordem.length;
    document.getElementById('prog-score').textContent = 'Acertos: ' + acertos;
    document.getElementById('prog-fill').style.width = (indiceAtual / ordem.length * 100) + '%';

    document.getElementById('word-emoji').textContent = item.emoji;
    document.getElementById('word-hint').textContent = item.dica;
    document.getElementById('word-display').innerHTML = montarDisplay(item, null);

    ['btn-c', 'btn-ce', 'btn-z'].forEach(function (id) {
      var b = document.getElementById(id);
      b.disabled = false;
      b.className = 'letter-btn';
    });

    var fb = document.getElementById('feedback');
    fb.className = 'feedback';
    fb.innerHTML = '';
    document.getElementById('next-wrap').classList.remove('show');
  }

  function escolherLetra(letra) {
    if (respondeu) return;
    respondeu = true;

    var item = ordem[indiceAtual];
    var certa = letraCerta(item);
    var acertou = (letra === certa);

    document.getElementById('word-display').innerHTML = montarDisplay(item, certa);

    var btnEscolhido = document.getElementById(botaoIdParaLetra(letra));
    var btnCerto = document.getElementById(botaoIdParaLetra(certa));

    ['btn-c', 'btn-ce', 'btn-z'].forEach(function (id) { document.getElementById(id).disabled = true; });
    btnCerto.classList.add('reveal-correct');
    btnEscolhido.classList.add(acertou ? 'picked-correct' : 'picked-wrong');

    var fb = document.getElementById('feedback');
    if (acertou) {
      acertos++;
      fb.className = 'feedback ok show';
      fb.innerHTML = '<span class="fb-title">Boa! 🎯</span>' + item.fb;
      playSound('correct');
    } else {
      fb.className = 'feedback no show';
      fb.innerHTML = '<span class="fb-title">Quase! Olha só 💛</span>' + item.fb;
      playSound('wrong');
    }

    document.getElementById('prog-score').textContent = 'Acertos: ' + acertos;
    document.getElementById('next-wrap').classList.add('show');
  }

  function proximaPalavra() {
    indiceAtual++;
    if (indiceAtual >= ordem.length) mostrarResultado();
    else mostrarPalavra();
  }

  function mostrarResultado() {
    document.getElementById('game-card').style.display = 'none';
    document.getElementById('progress-wrap').style.display = 'none';

    var total = ordem.length;
    var pct = Math.round((acertos / total) * 100);
    window.sabendoScore = pct;

    var emoji, titulo, texto;
    if (pct === 100) {
      emoji = '🏆'; titulo = 'Perfeito!';
      texto = 'Você completou todas as palavras! Zizo está muito orgulhoso!';
    } else if (pct >= 70) {
      emoji = '🎉'; titulo = 'Muito bem!';
      texto = 'Você já sabe quando usar c, ç e z. Continue assim!';
    } else if (pct >= 40) {
      emoji = '🌟'; titulo = 'Bom começo!';
      texto = 'Releia as dicas de cada palavra e tente outra vez!';
    } else {
      emoji = '💪'; titulo = 'Vamos treinar mais!';
      texto = 'Lembre: c antes de e/i, ç antes de a/o/u, e z faz um som bem forte!';
    }

    document.getElementById('res-emoji').textContent = emoji;
    document.getElementById('res-title').textContent = titulo;
    document.getElementById('res-score').textContent = 'Você acertou ' + acertos + ' de ' + total + ' (' + pct + '%)';
    document.getElementById('res-text').textContent = texto;
    document.getElementById('result').classList.add('show');
  }

  function reiniciarJogo() {
    ordem = embaralhar(palavras);
    indiceAtual = 0;
    acertos = 0;
    document.getElementById('result').classList.remove('show');
    document.getElementById('game-card').style.display = 'block';
    document.getElementById('progress-wrap').style.display = 'block';
    mostrarPalavra();
  }

  window.escolherLetra   = escolherLetra;
  window.proximaPalavra  = proximaPalavra;
  window.reiniciarJogo   = reiniciarJogo;

  ordem = embaralhar(palavras);
  mostrarPalavra();

})();
</script>

</body>
