<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Til e o Som Nasal — Sons e Letras: j, g, til e s | Portal da Lis</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #E8430A;
  --light: #FB8C5A;
  --bg: #FFF4EF;
  --dark: #7A1F04;
  --correct: #22C55E;
  --wrong: #EF4444;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  font-size: 1.1rem;
}

header {
  background: linear-gradient(135deg, #7A1F04, #E8430A 60%, #FB8C5A);
  color: white;
  padding: 24px 20px;
  text-align: center;
}

header .emoji { font-size: 2.8rem; display: block; margin-bottom: 8px; }

header h1 {
  font-family: 'Baloo 2', cursive;
  font-size: 1.8rem;
  font-weight: 900;
  line-height: 1.2;
}

header p { font-size: 1rem; opacity: 0.92; margin-top: 6px; }

main {
  flex: 1;
  padding: 20px 16px;
  max-width: 700px;
  margin: 0 auto;
  width: 100%;
}

.rule-box {
  background: #FFE7DB;
  border: 3px solid var(--light);
  border-radius: 16px;
  padding: 14px 18px;
  margin-bottom: 18px;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--dark);
  line-height: 1.5;
  text-align: center;
}

.progress-wrap {
  background: white;
  border-radius: 16px;
  padding: 14px 18px;
  box-shadow: 0 3px 12px rgba(232,67,10,0.15);
  margin-bottom: 18px;
}

.progress-top {
  display: flex;
  justify-content: space-between;
  font-weight: 800;
  color: var(--dark);
  font-size: 1.05rem;
  margin-bottom: 8px;
}

.progress-bar { height: 14px; background: #FEDCCB; border-radius: 10px; overflow: hidden; }

.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--primary), var(--light));
  border-radius: 10px;
  transition: width 0.35s ease;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 24px 20px;
  box-shadow: 0 4px 20px rgba(232,67,10,0.15);
  text-align: center;
}

.round-tag {
  display: inline-block;
  background: var(--bg);
  color: var(--primary);
  border-radius: 20px;
  padding: 6px 16px;
  font-size: 0.98rem;
  font-weight: 900;
  margin-bottom: 12px;
}

.word-emoji { font-size: 3.2rem; display: block; margin-bottom: 4px; }

.ask {
  font-size: 1.3rem;
  font-weight: 800;
  color: var(--dark);
  line-height: 1.35;
  margin-bottom: 18px;
}

.letters-row {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 8px;
}

.letter-tile {
  background: var(--bg);
  border: 4px solid #FEDCCB;
  border-radius: 14px;
  min-width: 54px;
  min-height: 64px;
  padding: 10px 8px;
  font-family: 'Baloo 2', cursive;
  font-size: 2.1rem;
  font-weight: 900;
  color: var(--dark);
  cursor: pointer;
  transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
}

.letter-tile:hover:not(:disabled) { transform: translateY(-4px); background: #FFE7DB; border-color: var(--light); }
.letter-tile:disabled { cursor: default; }
.letter-tile.picked-correct { background: #DCFCE7; border-color: var(--correct); color: #166534; }
.letter-tile.picked-wrong { background: #FEE2E2; border-color: var(--wrong); color: #991B1B; }
.letter-tile.reveal-correct { background: #DCFCE7; border-color: var(--correct); color: #166534; }

.pair-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  max-width: 460px;
  margin: 0 auto;
}

.pair-btn {
  background: var(--bg);
  border: 4px solid #FEDCCB;
  border-radius: 18px;
  padding: 20px 14px;
  font-family: 'Baloo 2', cursive;
  font-size: 1.8rem;
  font-weight: 900;
  color: var(--dark);
  cursor: pointer;
  transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
  min-height: 76px;
  min-width: 44px;
}

.pair-btn:hover:not(:disabled) { transform: translateY(-3px); background: #FFE7DB; border-color: var(--light); }
.pair-btn:disabled { cursor: default; }
.pair-btn.picked-correct { background: #DCFCE7; border-color: var(--correct); color: #166534; }
.pair-btn.picked-wrong { background: #FEE2E2; border-color: var(--wrong); color: #991B1B; }
.pair-btn.reveal-correct { background: #DCFCE7; border-color: var(--correct); color: #166534; }

.feedback {
  display: none;
  margin-top: 18px;
  border-radius: 14px;
  padding: 16px 18px;
  font-size: 1.1rem;
  font-weight: 700;
  line-height: 1.45;
  text-align: left;
}

.feedback.show { display: block; }
.feedback.ok { background: #DCFCE7; color: #166534; border: 3px solid var(--correct); }
.feedback.no { background: #FEF3C7; color: #92400E; border: 3px solid #F59E0B; }
.feedback .fb-title { font-family: 'Baloo 2', cursive; font-size: 1.25rem; display: block; margin-bottom: 4px; }
.feedback .fb-word { font-family: 'Baloo 2', cursive; font-size: 1.6rem; display: block; margin-top: 6px; }

.next-wrap { text-align: center; margin-top: 18px; display: none; }
.next-wrap.show { display: block; }

.btn-main {
  background: linear-gradient(135deg, var(--primary), var(--light));
  color: white;
  border: none;
  border-radius: 14px;
  padding: 16px 32px;
  font-family: 'Nunito', sans-serif;
  font-size: 1.15rem;
  font-weight: 800;
  cursor: pointer;
  transition: transform 0.15s ease;
  min-height: 52px;
  min-width: 44px;
}

.btn-main:hover { transform: scale(1.04); }

.result {
  display: none;
  background: white;
  border-radius: 20px;
  padding: 28px 22px;
  box-shadow: 0 4px 20px rgba(232,67,10,0.18);
  text-align: center;
}

.result.show { display: block; }
.result .res-emoji { font-size: 4rem; display: block; margin-bottom: 10px; }
.result h2 { font-family: 'Baloo 2', cursive; font-size: 1.9rem; color: var(--dark); margin-bottom: 10px; }
.result .res-score { font-size: 1.4rem; font-weight: 900; color: var(--primary); margin-bottom: 10px; }
.result p { font-size: 1.15rem; color: #555; font-weight: 700; line-height: 1.5; margin-bottom: 18px; }

.btn-reset {
  background: white;
  border: 3px solid var(--primary);
  color: var(--primary);
  border-radius: 14px;
  padding: 14px 26px;
  font-family: 'Nunito', sans-serif;
  font-size: 1.1rem;
  font-weight: 800;
  cursor: pointer;
  min-height: 52px;
  transition: all 0.2s ease;
}

.btn-reset:hover { background: var(--primary); color: white; }

footer { text-align: center; padding: 20px 16px; }

.btn-back {
  background: white;
  border: 3px solid var(--primary);
  color: var(--primary);
  border-radius: 14px;
  padding: 14px 28px;
  font-family: 'Nunito', sans-serif;
  font-size: 1.1rem;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.2s ease;
  min-height: 48px;
}

.btn-back:hover { background: var(--primary); color: white; }

@media (max-width: 480px) {
  body { font-size: 1.15rem; }
  header h1 { font-size: 1.3rem; }
  main { padding: 14px 10px; }
  .pair-grid { grid-template-columns: 1fr; }
  .pair-btn { font-size: 1.6rem; width: 100%; }
  .letter-tile { min-width: 46px; min-height: 56px; font-size: 1.7rem; }
  .ask { font-size: 1.15rem; }
  .btn-main, .btn-reset { width: 100%; }
}
</style>
</head>
<body>

<header>
  <span class="emoji">〰️</span>
  <h1>O Til e o Som Nasal</h1>
  <p>Tilim perdeu os tis! Ajude a colocar cada um no lugar.</p>
</header>

<main>
  <div class="rule-box">
    💡 O <strong>til (~)</strong> marca o <strong>som nasal</strong> que a gente emite ao falar a palavra.
  </div>

  <div class="progress-wrap" id="progress-wrap">
    <div class="progress-top">
      <span id="prog-label">Desafio 1 de 10</span>
      <span id="prog-score">Acertos: 0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
  </div>

  <div class="card" id="game-card">
    <div class="round-tag" id="round-tag"></div>
    <span class="word-emoji" id="word-emoji"></span>
    <div class="ask" id="ask-text"></div>
    <div class="letters-row" id="letters-row"></div>
    <div class="pair-grid" id="pair-grid"></div>
    <div class="feedback" id="feedback"></div>
    <div class="next-wrap" id="next-wrap">
      <button class="btn-main" onclick="proximoDesafio()">Próximo →</button>
    </div>
  </div>

  <div class="result" id="result">
    <span class="res-emoji" id="res-emoji">🎉</span>
    <h2 id="res-title"></h2>
    <div class="res-score" id="res-score"></div>
    <p id="res-text"></p>
    <button class="btn-reset" onclick="reiniciarJogo()">Jogar de novo 🔁</button>
  </div>
</main>

<footer>
  <button class="btn-back" onclick="voltarAoPortal()">← Voltar ao Portal</button>
</footer>

<script>
(function () {

  /* RODADA 1 — clicar na letra que precisa do til.
     Conferência caractere a caractere de cada base:
       pao      p(0) a(1) o(2)                                 → alvo 1 → pão
       mao      m(0) a(1) o(2)                                 → alvo 1 → mão
       aviao    a(0) v(1) i(2) a(3) o(4)                       → alvo 3 → avião
       limao    l(0) i(1) m(2) a(3) o(4)                       → alvo 3 → limão
       roma     r(0) o(1) m(2) a(3)                            → alvo 3 → romã
       coraçao  c(0) o(1) r(2) a(3) ç(4) a(5) o(6)             → alvo 5 → coração
     A palavra final é montada pelo código (base + 'ã' no alvo),
     nunca digitada à mão.                                              */
  var rodada1 = [
    { base: 'pao',     alvo: 1, emoji: '🍞' },
    { base: 'mao',     alvo: 1, emoji: '✋' },
    { base: 'aviao',   alvo: 3, emoji: '✈️' },
    { base: 'limao',   alvo: 3, emoji: '🍋' },
    { base: 'roma',    alvo: 3, emoji: '🌺' },
    { base: 'coraçao', alvo: 5, emoji: '❤️' }
  ];

  /* RODADA 2 — escolher a palavra escrita corretamente.
     Todas do banco de palavras do livro.                              */
  var rodada2 = [
    { certa: 'melão',   errada: 'melao',   emoji: '🍈' },
    { certa: 'sabão',   errada: 'sabao',   emoji: '🧼' },
    { certa: 'hortelã', errada: 'hortela', emoji: '🌿' },
    { certa: 'cão',     errada: 'cao',     emoji: '🐶' }
  ];

  var desafios = [];
  var indiceAtual = 0;
  var acertos = 0;
  var respondeu = false;

  function playSound(type) {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    if (type === 'correct') {
      o.frequency.setValueAtTime(523, ctx.currentTime);
      o.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
      o.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
      g.gain.setValueAtTime(0.3, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      o.start(); o.stop(ctx.currentTime + 0.5);
    } else {
      o.frequency.setValueAtTime(300, ctx.currentTime);
      o.frequency.setValueAtTime(200, ctx.currentTime + 0.15);
      g.gain.setValueAtTime(0.3, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      o.start(); o.stop(ctx.currentTime + 0.4);
    }
  }

  function embaralhar(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function comTil(item) {
    return item.base.substring(0, item.alvo) + 'ã' + item.base.substring(item.alvo + 1);
  }

  function montarDesafios() {
    var lista = [];
    embaralhar(rodada1).forEach(function (it) { lista.push({ tipo: 'letra', dados: it }); });
    embaralhar(rodada2).forEach(function (it) { lista.push({ tipo: 'par', dados: it }); });
    return lista;
  }

  function atualizarProgresso() {
    document.getElementById('prog-label').textContent =
      'Desafio ' + (indiceAtual + 1) + ' de ' + desafios.length;
    document.getElementById('prog-score').textContent = 'Acertos: ' + acertos;
    document.getElementById('prog-fill').style.width = (indiceAtual / desafios.length * 100) + '%';
  }

  function limparCard() {
    document.getElementById('letters-row').innerHTML = '';
    document.getElementById('letters-row').style.display = 'none';
    document.getElementById('pair-grid').innerHTML = '';
    document.getElementById('pair-grid').style.display = 'none';
    var fb = document.getElementById('feedback');
    fb.className = 'feedback';
    fb.innerHTML = '';
    document.getElementById('next-wrap').classList.remove('show');
  }

  function mostrarDesafio() {
    respondeu = false;
    limparCard();
    atualizarProgresso();

    var d = desafios[indiceAtual];
    document.getElementById('word-emoji').textContent = d.dados.emoji;

    if (d.tipo === 'letra') mostrarLetra(d.dados);
    else mostrarPar(d.dados);
  }

  function mostrarLetra(item) {
    document.getElementById('round-tag').textContent = '〰️ Rodada 1 — Onde vai o til?';
    document.getElementById('ask-text').innerHTML =
      'Clique na letra que precisa do <strong>til</strong> para a palavra ficar certa:';

    var row = document.getElementById('letters-row');
    row.style.display = 'flex';

    for (var i = 0; i < item.base.length; i++) {
      (function (idx) {
        var btn = document.createElement('button');
        btn.className = 'letter-tile';
        btn.type = 'button';
        btn.textContent = item.base.charAt(idx);
        btn.addEventListener('click', function () { responderLetra(item, idx, btn, row); });
        row.appendChild(btn);
      })(i);
    }
  }

  function responderLetra(item, idx, btn, row) {
    if (respondeu) return;
    respondeu = true;

    var acertou = (idx === item.alvo);
    var tiles = row.querySelectorAll('.letter-tile');
    for (var i = 0; i < tiles.length; i++) tiles[i].disabled = true;
    tiles[item.alvo].classList.add('reveal-correct');
    tiles[item.alvo].textContent = 'ã';
    btn.classList.add(acertou ? 'picked-correct' : 'picked-wrong');

    var palavraFinal = comTil(item);
    var fb = document.getElementById('feedback');
    if (acertou) {
      acertos++;
      fb.className = 'feedback ok show';
      fb.innerHTML = '<span class="fb-title">Isso mesmo! 🎯</span>' +
        'O til marca o som nasal dessa palavra. Fale devagar e sinta o ar no nariz!' +
        '<span class="fb-word">' + palavraFinal + '</span>';
      playSound('correct');
    } else {
      fb.className = 'feedback no show';
      fb.innerHTML = '<span class="fb-title">Quase! Olha só 💛</span>' +
        'O til vai na letra em verde. Ele marca o som nasal da palavra.' +
        '<span class="fb-word">' + palavraFinal + '</span>';
      playSound('wrong');
    }

    document.getElementById('prog-score').textContent = 'Acertos: ' + acertos;
    document.getElementById('next-wrap').classList.add('show');
  }

  function mostrarPar(item) {
    document.getElementById('round-tag').textContent = '✏️ Rodada 2 — Qual está certa?';
    document.getElementById('ask-text').innerHTML =
      'Clique na palavra <strong>escrita corretamente</strong>:';

    var grid = document.getElementById('pair-grid');
    grid.style.display = 'grid';

    var opcoes = embaralhar([
      { texto: item.certa,  ok: true },
      { texto: item.errada, ok: false }
    ]);

    opcoes.forEach(function (op) {
      var btn = document.createElement('button');
      btn.className = 'pair-btn';
      btn.type = 'button';
      btn.textContent = op.texto;
      btn.addEventListener('click', function () { responderPar(item, op.ok, btn, grid, opcoes); });
      grid.appendChild(btn);
    });
  }

  function responderPar(item, acertou, btn, grid, opcoes) {
    if (respondeu) return;
    respondeu = true;

    var botoes = grid.querySelectorAll('.pair-btn');
    for (var i = 0; i < botoes.length; i++) {
      botoes[i].disabled = true;
      if (opcoes[i].ok) botoes[i].classList.add('reveal-correct');
    }
    btn.classList.add(acertou ? 'picked-correct' : 'picked-wrong');

    var fb = document.getElementById('feedback');
    if (acertou) {
      acertos++;
      fb.className = 'feedback ok show';
      fb.innerHTML = '<span class="fb-title">Boa! 🎯</span>' +
        'Sem o til a palavra perde o som nasal. O til marca esse som!' +
        '<span class="fb-word">' + item.certa + '</span>';
      playSound('correct');
    } else {
      fb.className = 'feedback no show';
      fb.innerHTML = '<span class="fb-title">Quase! Olha só 💛</span>' +
        'A palavra certa leva o til, porque tem som nasal.' +
        '<span class="fb-word">' + item.certa + '</span>';
      playSound('wrong');
    }

    document.getElementById('prog-score').textContent = 'Acertos: ' + acertos;
    document.getElementById('next-wrap').classList.add('show');
  }

  function proximoDesafio() {
    indiceAtual++;
    if (indiceAtual >= desafios.length) mostrarResultado();
    else mostrarDesafio();
  }

  function mostrarResultado() {
    document.getElementById('game-card').style.display = 'none';
    document.getElementById('progress-wrap').style.display = 'none';

    var total = desafios.length;
    var pct = Math.round((acertos / total) * 100);
    window.sabendoScore = pct;

    var emoji, titulo, texto;
    if (pct === 100) {
      emoji = '🏆'; titulo = 'Perfeito!';
      texto = 'Todos os tis voltaram para o lugar! Tilim está balançando de alegria!';
    } else if (pct >= 70) {
      emoji = '🎉'; titulo = 'Muito bem!';
      texto = 'Você já reconhece o som nasal das palavras. Continue assim!';
    } else if (pct >= 40) {
      emoji = '🌟'; titulo = 'Bom começo!';
      texto = 'Fale as palavras em voz alta: pão, mão, coração. Sentiu o nariz vibrar?';
    } else {
      emoji = '💪'; titulo = 'Vamos treinar mais!';
      texto = 'O til marca o som nasal. Leia as palavras devagar e tente outra vez!';
    }

    document.getElementById('res-emoji').textContent = emoji;
    document.getElementById('res-title').textContent = titulo;
    document.getElementById('res-score').textContent = 'Você acertou ' + acertos + ' de ' + total + ' (' + pct + '%)';
    document.getElementById('res-text').textContent = texto;
    document.getElementById('result').classList.add('show');
  }

  function reiniciarJogo() {
    desafios = montarDesafios();
    indiceAtual = 0;
    acertos = 0;
    document.getElementById('result').classList.remove('show');
    document.getElementById('game-card').style.display = 'block';
    document.getElementById('progress-wrap').style.display = 'block';
    mostrarDesafio();
  }

  window.proximoDesafio = proximoDesafio;
  window.reiniciarJogo  = reiniciarJogo;

  desafios = montarDesafios();
  mostrarDesafio();

})();
</script>

    get: function () { return _scoreVal; }
  });
  window._abrirGamificacao = abrirGamificacao;
})();
</script>

<button id="gamificacao-btn"
  onclick="window._abrirGamificacao()"
  style="display:none;margin:24px auto;padding:16px 32px;
    background:linear-gradient(135deg,#E8430A,#FB8C5A);
    color:#fff;border:none;border-radius:50px;

    cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.2);
    width:fit-content;">
  Coletar minha carta! 🃏
</button>
