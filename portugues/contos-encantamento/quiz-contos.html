<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz: Contos de Encantamento | Portal da Lis</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #E8430A;
  --light: #FB8C5A;
  --bg: #FFF4EF;
  --dark: #7A1F04;
  --correct: #22C55E;
  --wrong: #EF4444;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  font-size: 1.1rem;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  background: linear-gradient(135deg, #7A1F04, #E8430A 60%, #FB8C5A);
  color: white;
  padding: 24px 20px;
  text-align: center;
}

header .emoji { font-size: 2.8rem; display: block; margin-bottom: 8px; }

header h1 {
  font-family: 'Baloo 2', cursive;
  font-size: 1.8rem;
  font-weight: 900;
  line-height: 1.2;
}

header p { font-size: 1rem; opacity: 0.9; margin-top: 4px; }

main {
  flex: 1;
  padding: 24px 16px;
  max-width: 700px;
  margin: 0 auto;
  width: 100%;
}

.progress-bar-wrap {
  background: #FEDCCB;
  border-radius: 99px;
  height: 12px;
  margin-bottom: 8px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--light));
  border-radius: 99px;
  transition: width 0.4s ease;
}

.progress-label {
  font-size: 0.95rem;
  color: var(--dark);
  font-weight: 700;
  margin-bottom: 20px;
  text-align: right;
}

.question-card {
  background: white;
  border-radius: 20px;
  padding: 28px 24px;
  box-shadow: 0 4px 20px rgba(232, 67, 10, 0.15);
  margin-bottom: 20px;
}

.question-number {
  font-size: 0.9rem;
  font-weight: 800;
  color: var(--primary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 10px;
}

.question-text {
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--dark);
  line-height: 1.4;
  margin-bottom: 24px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.option-btn {
  background: var(--bg);
  border: 3px solid #FEDCCB;
  border-radius: 14px;
  padding: 16px 20px;
  font-family: 'Nunito', sans-serif;
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--dark);
  cursor: pointer;
  text-align: left;
  transition: all 0.2s ease;
  min-height: 56px;
  min-width: 44px;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
}

.option-btn:hover:not(:disabled) {
  border-color: var(--primary);
  background: #FFE7DB;
  transform: translateX(4px);
}

.option-btn.correct {
  background: #DCFCE7;
  border-color: var(--correct);
  color: #166534;
}

.option-btn.wrong {
  background: #FEE2E2;
  border-color: var(--wrong);
  color: #991B1B;
}

.option-btn:disabled { cursor: default; transform: none; }

.option-letter {
  background: var(--primary);
  color: white;
  border-radius: 8px;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  font-weight: 900;
  flex-shrink: 0;
}

.option-btn.correct .option-letter { background: var(--correct); }
.option-btn.wrong .option-letter { background: var(--wrong); }

.feedback-box {
  background: white;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 4px 20px rgba(232, 67, 10, 0.15);
  margin-bottom: 20px;
  display: none;
  align-items: flex-start;
  gap: 14px;
}

.feedback-box.show { display: flex; }
.feedback-box.correct-fb { border-left: 6px solid var(--correct); }
.feedback-box.wrong-fb { border-left: 6px solid var(--wrong); }

.feedback-icon { font-size: 2rem; flex-shrink: 0; }

.feedback-text {
  font-size: 1.15rem;
  color: var(--dark);
  font-weight: 700;
  line-height: 1.4;
}

.btn-next {
  background: linear-gradient(135deg, var(--primary), var(--light));
  color: white;
  border: none;
  border-radius: 14px;
  padding: 16px 32px;
  font-family: 'Nunito', sans-serif;
  font-size: 1.2rem;
  font-weight: 800;
  cursor: pointer;
  width: 100%;
  transition: transform 0.15s ease;
  min-height: 56px;
}

.btn-next:hover { transform: scale(1.02); }

.result-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 20px;
  padding: 20px 0;
}

.result-screen.show { display: flex; }

.result-trophy { font-size: 5rem; animation: bounce 0.8s infinite alternate; }

@keyframes bounce {
  from { transform: translateY(0); }
  to { transform: translateY(-12px); }
}

.result-title {
  font-family: 'Baloo 2', cursive;
  font-size: 2rem;
  font-weight: 900;
  color: var(--dark);
}

.result-score {
  font-size: 3.5rem;
  font-weight: 900;
  color: var(--primary);
}

.result-msg {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--dark);
  max-width: 420px;
  line-height: 1.5;
}

.btn-retry {
  background: linear-gradient(135deg, var(--primary), var(--light));
  color: white;
  border: none;
  border-radius: 14px;
  padding: 16px 40px;
  font-family: 'Nunito', sans-serif;
  font-size: 1.2rem;
  font-weight: 800;
  cursor: pointer;
  transition: transform 0.15s ease;
  min-height: 56px;
}

.btn-retry:hover { transform: scale(1.05); }

footer { text-align: center; padding: 20px 16px; }

.btn-back {
  background: white;
  border: 3px solid var(--primary);
  color: var(--primary);
  border-radius: 14px;
  padding: 14px 28px;
  font-family: 'Nunito', sans-serif;
  font-size: 1.1rem;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.2s ease;
  min-height: 48px;
}

.btn-back:hover { background: var(--primary); color: white; }

@media (max-width: 480px) {
  body { font-size: 1.15rem; }
  header h1 { font-size: 1.3rem; }
  main { padding: 16px 12px; }
  .question-text { font-size: 1.3rem; }
  .question-card { padding: 20px 16px; }
  .option-btn { font-size: 1.1rem; padding: 14px 16px; width: 100%; justify-content: flex-start; }
}
</style>
</head>
<body>

<header>
  <span class="emoji">🪈</span>
  <h1>Quiz: Contos de Encantamento</h1>
  <p>10 perguntas · Flautim quer ver o que você aprendeu!</p>
</header>

<main>
  <div id="quiz-area">
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
    </div>
    <div class="progress-label" id="progress-label">Pergunta 1 de 10</div>

    <div class="question-card">
      <div class="question-number" id="q-number">Pergunta 1</div>
      <div class="question-text" id="q-text"></div>
      <div class="options" id="q-options"></div>
    </div>

    <div class="feedback-box" id="feedback-box">
      <div class="feedback-icon" id="feedback-icon"></div>
      <div class="feedback-text" id="feedback-text"></div>
    </div>

    <button class="btn-next" id="btn-next" onclick="nextQuestion()" style="display:none">
      Próxima pergunta →
    </button>
  </div>

  <div class="result-screen" id="result-screen">
    <div class="result-trophy" id="result-trophy">🪈</div>
    <div class="result-title">Quiz concluído!</div>
    <div class="result-score" id="result-score"></div>
    <div class="result-msg" id="result-msg"></div>
    <button class="btn-retry" onclick="restartQuiz()">Jogar de novo 🔄</button>
  </div>
</main>

<footer>
  <button class="btn-back" onclick="voltarAoPortal()">← Voltar ao Portal</button>
</footer>

<script>
const questions = [
  {
    text: "Qual expressão costuma abrir um conto de encantamento?",
    options: ["Era uma vez", "Fim da história", "Bom dia para você"],
    correctText: "Era uma vez",
    feedback: "Isso mesmo! \"Era uma vez\" abre muitos contos de encantamento. 📖"
  },
  {
    text: "\"Há muito, muito tempo\" quer dizer que a história aconteceu:",
    options: ["Em um passado distante", "Hoje de manhã bem cedo", "Daqui a muitos anos"],
    correctText: "Em um passado distante",
    feedback: "Certinho! Essa expressão mostra um passado bem distante. ⏳"
  },
  {
    text: "Qual destes é uma das personagens de \"O flautista de Hamelin\"?",
    options: ["O flautista", "A princesa", "O gigante"],
    correctText: "O flautista",
    feedback: "Muito bem! O flautista é a personagem principal do conto. 🪈"
  },
  {
    text: "Quem seguiu o flautista até o rio quando ele tocou a melodia?",
    options: ["Os ratos", "Os cavalos", "Os pássaros"],
    correctText: "Os ratos",
    feedback: "Isso! Os ratos seguiram a melodia da flauta até o rio. 🐀"
  },
  {
    text: "Qual é o elemento mágico do conto do flautista?",
    options: ["A flauta", "A coroa", "O espelho"],
    correctText: "A flauta",
    feedback: "Exato! A flauta é o elemento mágico dessa história. ✨"
  },
  {
    text: "Como se chama o problema que complica a vida das personagens?",
    options: ["Conflito", "Desfecho", "Título"],
    correctText: "Conflito",
    feedback: "Muito bem! O conflito é o problema que complica a história. ⚡"
  },
  {
    text: "Quando o conflito é solucionado, a história chega ao seu:",
    options: ["Desfecho", "Começo", "Conflito"],
    correctText: "Desfecho",
    feedback: "Certinho! Conflito resolvido, história no desfecho. ✅"
  },
  {
    text: "Qual expressão mostra que o conto teve um final feliz?",
    options: ["E viveram felizes para sempre", "Há muito, muito tempo", "Era uma vez"],
    correctText: "E viveram felizes para sempre",
    feedback: "Isso aí! Essa frase fecha o conto com um final feliz. 💖"
  },
  {
    text: "No livro, a palavra PRAGA quer dizer:",
    options: [
      "Animal que causa danos a muitas pessoas",
      "Barulho produzido por muitas vozes",
      "Apego grande ao dinheiro das pessoas"
    ],
    correctText: "Animal que causa danos a muitas pessoas",
    feedback: "Muito bem! Em Hamelin, os ratos eram a praga da cidade. 🐀"
  },
  {
    text: "E a expressão EM VÃO quer dizer:",
    options: [
      "Esforço que não alcança o resultado",
      "Barulho produzido por muitas vozes",
      "Querer muito mais do que precisa"
    ],
    correctText: "Esforço que não alcança o resultado",
    feedback: "Isso mesmo! Em vão é quando a gente tenta e não consegue. 🙃"
  }
];

let current = 0;
let score = 0;
let answered = false;

function playSound(type) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  if (type === 'correct') {
    o.frequency.setValueAtTime(523, ctx.currentTime);
    o.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
    o.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
    g.gain.setValueAtTime(0.3, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    o.start(); o.stop(ctx.currentTime + 0.5);
  } else {
    o.frequency.setValueAtTime(300, ctx.currentTime);
    o.frequency.setValueAtTime(200, ctx.currentTime + 0.15);
    g.gain.setValueAtTime(0.3, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    o.start(); o.stop(ctx.currentTime + 0.4);
  }
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderQuestion() {
  answered = false;
  const q = questions[current];
  const letters = ['A', 'B', 'C'];

  document.getElementById('q-number').textContent = `Pergunta ${current + 1}`;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('progress-label').textContent = `Pergunta ${current + 1} de ${questions.length}`;
  document.getElementById('progress-bar').style.width = `${(current / questions.length) * 100}%`;

  document.getElementById('feedback-box').className = 'feedback-box';
  document.getElementById('btn-next').style.display = 'none';

  const optionsEl = document.getElementById('q-options');
  optionsEl.innerHTML = '';

  const optsWithCorrect = q.options.map(opt => ({ text: opt, isCorrect: opt === q.correctText }));
  const shuffled = shuffleArray(optsWithCorrect);

  shuffled.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    const letter = document.createElement('span');
    letter.className = 'option-letter';
    letter.textContent = letters[i];
    btn.appendChild(letter);
    btn.appendChild(document.createTextNode(' ' + opt.text));
    btn.onclick = () => selectAnswer(i, opt.isCorrect, shuffled);
    optionsEl.appendChild(btn);
  });
}

function selectAnswer(index, isCorrect, shuffled) {
  if (answered) return;
  answered = true;

  const q = questions[current];
  const buttons = document.querySelectorAll('.option-btn');
  const feedbackBox = document.getElementById('feedback-box');

  buttons.forEach(btn => btn.disabled = true);

  buttons[index].classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) {
    const correctIdx = shuffled.findIndex(o => o.isCorrect);
    buttons[correctIdx].classList.add('correct');
  }

  if (isCorrect) {
    score++;
    playSound('correct');
    feedbackBox.className = 'feedback-box show correct-fb';
    document.getElementById('feedback-icon').textContent = '✅';
  } else {
    playSound('wrong');
    feedbackBox.className = 'feedback-box show wrong-fb';
    document.getElementById('feedback-icon').textContent = '❌';
  }

  document.getElementById('feedback-text').textContent = q.feedback;

  const btnNext = document.getElementById('btn-next');
  btnNext.style.display = 'block';
  btnNext.textContent = current === questions.length - 1 ? 'Ver resultado 🪈' : 'Próxima pergunta →';
}

function nextQuestion() {
  current++;
  if (current >= questions.length) showResult();
  else renderQuestion();
}

function showResult() {
  window.sabendoScore = Math.round((score / questions.length) * 100);
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('result-screen').classList.add('show');

  document.getElementById('result-score').textContent = `${score} / ${questions.length}`;
  document.getElementById('progress-bar').style.width = '100%';

  let trophy, msg;
  if (score === questions.length) {
    trophy = '🏆'; msg = 'Incrível! Você acertou tudo sobre os contos de encantamento! Flautim está orgulhoso!';
  } else if (score >= 8) {
    trophy = '🪈'; msg = 'Muito bem! Você já conhece o começo, o conflito e o desfecho de um conto!';
  } else if (score >= 5) {
    trophy = '📖'; msg = 'Bom trabalho! Releia a HQ do Flautim e volte para acertar ainda mais!';
  } else {
    trophy = '📚'; msg = 'Continue praticando! Os contos de encantamento têm muita coisa legal para descobrir!';
  }

  document.getElementById('result-trophy').textContent = trophy;
  document.getElementById('result-msg').textContent = msg;

  if (score >= 8) playSound('correct');
}

function restartQuiz() {
  current = 0;
  score = 0;
  answered = false;
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('result-screen').classList.remove('show');
  renderQuestion();
}

renderQuestion();
</script>
