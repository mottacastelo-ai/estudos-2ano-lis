<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Memória das Palavras — Contos de Encantamento | Portal da Lis</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #E8430A;
  --light: #FB8C5A;
  --bg: #FFF4EF;
  --dark: #7A1F04;
  --correct: #22C55E;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  font-size: 1.1rem;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  background: linear-gradient(135deg, #7A1F04, #E8430A 60%, #FB8C5A);
  color: white;
  padding: 24px 20px;
  text-align: center;
}

header .emoji { font-size: 2.8rem; display: block; margin-bottom: 8px; }

header h1 {
  font-family: 'Baloo 2', cursive;
  font-size: 1.8rem;
  font-weight: 900;
  line-height: 1.2;
}

header p { font-size: 1rem; opacity: 0.92; margin-top: 6px; }

main {
  flex: 1;
  padding: 24px 16px;
  max-width: 900px;
  margin: 0 auto;
  width: 100%;
}

.instrucao {
  background: white;
  border-left: 6px solid var(--primary);
  border-radius: 14px;
  padding: 18px 20px;
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--dark);
  line-height: 1.45;
  box-shadow: 0 4px 16px rgba(232, 67, 10, 0.12);
  margin-bottom: 18px;
}

.placar {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.placar div {
  background: white;
  border: 3px solid var(--light);
  border-radius: 99px;
  padding: 10px 20px;
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--dark);
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.carta {
  position: relative;
  aspect-ratio: 3 / 4;
  min-height: 110px;
  perspective: 800px;
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
  font-family: 'Nunito', sans-serif;
}

.carta-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.45s;
  transform-style: preserve-3d;
}

.carta.virada .carta-inner { transform: rotateY(180deg); }

.face {
  position: absolute;
  inset: 0;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  text-align: center;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  box-shadow: 0 4px 14px rgba(232, 67, 10, 0.18);
}

.face-frente {
  background: linear-gradient(135deg, var(--primary), var(--light));
  color: white;
  font-size: 2.4rem;
}

.face-verso {
  background: white;
  border: 3px solid var(--light);
  transform: rotateY(180deg);
  color: var(--dark);
  font-weight: 800;
  line-height: 1.3;
  flex-direction: column;
  gap: 4px;
}

.face-verso.tipo-palavra {
  font-family: 'Baloo 2', cursive;
  font-size: 1.35rem;
  color: var(--primary);
}

.face-verso.tipo-significado { font-size: 0.98rem; font-weight: 700; }

.carta.achada .carta-inner { transform: rotateY(180deg); }
.carta.achada .face-verso { border-color: var(--correct); background: #DCFCE7; }
.carta.achada { cursor: default; }

.botoes { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 22px; }

.btn {
  flex: 1;
  border: none;
  border-radius: 14px;
  padding: 16px 24px;
  font-family: 'Nunito', sans-serif;
  font-size: 1.2rem;
  font-weight: 800;
  cursor: pointer;
  min-height: 56px;
  min-width: 44px;
  background: white;
  color: var(--primary);
  border: 3px solid var(--primary);
}

.btn:hover { background: var(--primary); color: white; }

.win-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(122, 31, 4, 0.88);
  padding: 24px 16px;
  overflow-y: auto;
  text-align: center;
}

.win-overlay.show { display: block; }

.win-card {
  background: white;
  border-radius: 24px;
  padding: 32px 24px;
  max-width: 460px;
  margin: 40px auto 0;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
}

.win-card .icone { font-size: 4.5rem; display: block; margin-bottom: 10px; }

.win-card h2 {
  font-family: 'Baloo 2', cursive;
  font-size: 1.8rem;
  color: var(--dark);
  margin-bottom: 10px;
}

.win-card p { font-size: 1.2rem; font-weight: 700; color: var(--dark); line-height: 1.45; }

.win-card .btn { width: 100%; margin-top: 18px; flex: none; }

footer { text-align: center; padding: 20px 16px; }

.btn-back {
  background: white;
  border: 3px solid var(--primary);
  color: var(--primary);
  border-radius: 14px;
  padding: 14px 28px;
  font-family: 'Nunito', sans-serif;
  font-size: 1.1rem;
  font-weight: 800;
  cursor: pointer;
  min-height: 48px;
}

.btn-back:hover { background: var(--primary); color: white; }

@media (max-width: 640px) {
  .grid { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 480px) {
  body { font-size: 1.15rem; }
  header h1 { font-size: 1.3rem; }
  main { padding: 16px 12px; }
  .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .face-verso.tipo-palavra { font-size: 1.2rem; }
  .face-verso.tipo-significado { font-size: 0.92rem; }
  .botoes { flex-direction: column; }
  .btn { width: 100%; }
}
</style>
</head>
<body>

<header>
  <span class="emoji">🃏</span>
  <h1>Jogo da Memória das Palavras</h1>
  <p>Ache a palavra e o seu significado · com Flautim 🪈</p>
</header>

<main>
  <div class="instrucao">
    Vire duas cartas e forme o par: de um lado a <strong>palavra</strong>,
    do outro o <strong>significado</strong> dela. São 6 pares para achar! 🃏
  </div>

  <div class="placar">
    <div>Pares: <span id="placar-pares">0</span> / 6</div>
    <div>Jogadas: <span id="placar-jogadas">0</span></div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="botoes">
    <button class="btn" onclick="reiniciarMemoria()">Embaralhar de novo 🔄</button>
  </div>
</main>

<div class="win-overlay" id="win-overlay">
  <div class="win-card">
    <span class="icone">🏆</span>
    <h2>Você achou todos os pares!</h2>
    <p id="win-texto"></p>
    <button id="gamificacao-btn-overlay"
      onclick="window._abrirGamificacao()"
      style="display:none;margin:18px auto 0;padding:16px 32px;
        background:linear-gradient(135deg,#E8430A,#FB8C5A);
        color:#fff;border:none;border-radius:50px;
        font-family:'Baloo 2',sans-serif;font-size:1.2rem;font-weight:800;
        cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.2);
        width:fit-content;">
      Coletar minha carta! 🃏
    </button>
    <button class="btn" onclick="fecharVitoria()">Jogar de novo 🔄</button>
  </div>
</div>

<footer>
  <button class="btn-back" onclick="voltarAoPortal()">← Voltar ao Portal</button>
</footer>

<script>
var paresData = [
  { id: 'p1', palavra: 'Praga',       significado: 'Animal que causa danos a grande quantidade de pessoas' },
  { id: 'p2', palavra: 'Avareza',     significado: 'Apego grande ao dinheiro, falta de generosidade' },
  { id: 'p3', palavra: 'Em vão',      significado: 'Esforço que não alcança o resultado esperado' },
  { id: 'p4', palavra: 'Algazarra',   significado: 'Barulho produzido por muitas vozes' },
  { id: 'p5', palavra: 'Ganância',    significado: 'Querer muito mais do que precisa' },
  { id: 'p6', palavra: 'Era uma vez', significado: 'Começo do conto' }
];

var TOTAL_PARES = paresData.length;
var estadoCartas = [];
var primeiraCarta = null;
var segundaCarta = null;
var travado = false;
var paresAchados = 0;
var jogadas = 0;

function playSound(type) {
  var ctx = new (window.AudioContext || window.webkitAudioContext)();
  var o = ctx.createOscillator();
  var g = ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  if (type === 'correct') {
    o.frequency.setValueAtTime(523, ctx.currentTime);
    o.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
    o.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
    g.gain.setValueAtTime(0.3, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    o.start(); o.stop(ctx.currentTime + 0.5);
  } else {
    o.frequency.setValueAtTime(300, ctx.currentTime);
    o.frequency.setValueAtTime(200, ctx.currentTime + 0.15);
    g.gain.setValueAtTime(0.3, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    o.start(); o.stop(ctx.currentTime + 0.4);
  }
}

function embaralhar(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function montarCartas() {
  var lista = [];
  paresData.forEach(function (par) {
    lista.push({ parId: par.id, tipo: 'palavra', texto: par.palavra });
    lista.push({ parId: par.id, tipo: 'significado', texto: par.significado });
  });

  var grid = document.getElementById('grid');
  grid.innerHTML = '';

  estadoCartas = embaralhar(lista);

  estadoCartas.forEach(function (item, i) {
    var carta = document.createElement('button');
    carta.className = 'carta';
    carta.type = 'button';
    carta.dataset.idx = i;
    carta.setAttribute('aria-label', 'Carta ' + (i + 1));

    var inner = document.createElement('div');
    inner.className = 'carta-inner';

    var frente = document.createElement('div');
    frente.className = 'face face-frente';
    frente.textContent = '🪈';

    var verso = document.createElement('div');
    verso.className = 'face face-verso tipo-' + item.tipo;
    verso.textContent = item.texto;

    inner.appendChild(frente);
    inner.appendChild(verso);
    carta.appendChild(inner);
    carta.addEventListener('click', function () { virarCarta(carta); });
    grid.appendChild(carta);
  });
}

function virarCarta(carta) {
  if (travado) return;
  if (carta.classList.contains('achada') || carta.classList.contains('virada')) return;

  carta.classList.add('virada');

  if (!primeiraCarta) { primeiraCarta = carta; return; }

  segundaCarta = carta;
  jogadas++;
  document.getElementById('placar-jogadas').textContent = jogadas;
  travado = true;

  var parA = estadoCartas[Number(primeiraCarta.dataset.idx)].parId;
  var parB = estadoCartas[Number(segundaCarta.dataset.idx)].parId;

  if (parA === parB) {
    playSound('correct');
    primeiraCarta.classList.add('achada');
    segundaCarta.classList.add('achada');
    paresAchados++;
    document.getElementById('placar-pares').textContent = paresAchados;
    limparSelecao();
    if (paresAchados === TOTAL_PARES) setTimeout(mostrarVitoria, 600);
  } else {
    playSound('wrong');
    var a = primeiraCarta, b = segundaCarta;
    setTimeout(function () {
      a.classList.remove('virada');
      b.classList.remove('virada');
      limparSelecao();
    }, 900);
  }
}

function limparSelecao() {
  primeiraCarta = null;
  segundaCarta = null;
  travado = false;
}

function mostrarVitoria() {
  window.sabendoScore = 100;
  document.getElementById('win-texto').textContent =
    'Você formou os 6 pares em ' + jogadas + ' jogadas. Flautim tocou uma música só para você! 🎵';
  document.getElementById('win-overlay').classList.add('show');
  playSound('correct');
}

function fecharVitoria() {
  document.getElementById('win-overlay').classList.remove('show');
  reiniciarMemoria();
}

function reiniciarMemoria() {
  primeiraCarta = null;
  segundaCarta = null;
  travado = false;
  paresAchados = 0;
  jogadas = 0;
  document.getElementById('placar-pares').textContent = '0';
  document.getElementById('placar-jogadas').textContent = '0';
  montarCartas();
}

window.virarCarta       = virarCarta;
window.reiniciarMemoria = reiniciarMemoria;
window.fecharVitoria    = fecharVitoria;

montarCartas();
</script>

<button id="gamificacao-btn"
  onclick="window._abrirGamificacao()"
  style="display:none;margin:24px auto;padding:16px 32px;
    background:linear-gradient(135deg,#E8430A,#FB8C5A);
    color:#fff;border:none;border-radius:50px;
    font-family:'Baloo 2',sans-serif;font-size:1.2rem;font-weight:800;
    cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.2);
    width:fit-content;">
  Coletar minha carta! 🃏
</button>
<script src="../../shared/portal-back.js"></script>
</body>
